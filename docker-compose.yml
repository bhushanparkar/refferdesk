# Local run: docker compose up --build   ->  http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: referdesk
      POSTGRES_PASSWORD: referdesk
      POSTGRES_DB: referdesk
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U referdesk"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://referdesk:referdesk@db:5432/referdesk
      JWT_SECRET: change-this-to-a-long-random-string
      SEED_DEMO: "true"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
