# Render Blueprint: New > Blueprint > connect your Git repo.
services:
  - type: web
    name: referdesk
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: referdesk-db
          property: connectionString
      # Add SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM in the dashboard
      # so sign-in codes are emailed.
databases:
  - name: referdesk-db
    plan: free
